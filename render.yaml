services:
  - type: web
    name: legalstart-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        value: "0"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: IMAGES_ENABLED
        value: "true"
